# In the server block of lumaria.allandestars.com (replaces the former "location = /ascal").
location = /ascal { return 301 /ascal/; }
location /ascal/ {
    proxy_pass http://127.0.0.1:8790/;          # reverse SSH tunnel to the ascal web app
    client_max_body_size 160m;
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    gzip on;
    gzip_types application/json text/css application/javascript text/csv;
}
