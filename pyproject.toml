[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ascal"
version = "1.0.0"
description = "Zero-shot geometric calibration of all-sky (fisheye) cameras from star positions"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "J. R. González Fernández", email = "juanrodrigo.gonzalezfernandez@unir.net"}]
keywords = ["all-sky camera", "fisheye", "astrometry", "calibration", "light pollution"]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "astropy>=5.2",
  "photutils>=1.6",
  "opencv-python-headless>=4.6",
  "Pillow>=9",
  "matplotlib>=3.6",
]

[project.optional-dependencies]
raw = ["rawpy>=0.18"]
web = ["fastapi>=0.100", "uvicorn>=0.22", "python-multipart>=0.0.6"]
dev = ["pytest", "jupyter", "nbconvert"]

[project.scripts]
ascal = "ascal.cli:main"

[tool.setuptools.packages.find]
include = ["ascal*"]

[tool.setuptools.package-data]
ascal = ["data/*.json", "data/NOTICE.md", "web/static/*"]

[project.urls]
Repository = "https://github.com/GonzalezFJR/ascal"

[tool.pytest.ini_options]
markers = ["slow: end-to-end calibrations (tens of seconds)"]
